version: "3.9"

services:

  # MongoDB
  mongo:
    image: mongo:7
    container_name: portfolio_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio_net

  # Node.js API backend
  backend:
    build: ./backend
    container_name: portfolio_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/portfolio
      CLIENT_ORIGIN: http://localhost
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
    networks:
      - portfolio_net

  # Nginx serves the static frontend and proxies /api → backend
  frontend:
    image: nginx:alpine
    container_name: portfolio_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - portfolio_net

volumes:
  mongo_data:
  uploads_data:

networks:
  portfolio_net:
